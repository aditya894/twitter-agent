name: Daily LinkedIn brief

on:
  schedule:
    # 01:00 UTC = 06:30 IST. GitHub cron can fire late under load, so this is
    # set early enough that a 20 minute delay still lands before the workday.
    - cron: "0 1 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Draft only, send no email"
        type: boolean
        default: false

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate and send brief
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EMAIL_PROVIDER: resend
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python src/main.py --dry-run
          else
            python src/main.py
          fi

      - name: Commit history
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "linkedin-brief-bot"
          git config user.email "actions@github.com"
          git add data/history.json
          if git diff --staged --quiet; then
            echo "No history change."
          else
            git commit -m "Brief history: $(date -u +%Y-%m-%d)"
            git push
          fi
