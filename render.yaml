services:
  - type: web
    name: twitter-agent
    runtime: docker
    plan: free
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false          # set manually in Render dashboard
      - key: DASHBOARD_PASSWORD
        sync: false          # leave blank to disable auth
      - key: PYTHONUTF8
        value: "1"
    healthCheckPath: /health
